services:
  # 1. AyuSync Node.js + Express + Socket.IO Backend
  - type: web
    name: ayusync-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm run render:build
    startCommand: npm run render:start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Supabase Transaction Pooler URL
      - key: DIRECT_URL
        sync: false # Set in Render Dashboard with your Supabase Direct URL (port 5432)
      - key: REDIS_URL
        sync: false # Set in Render Dashboard with your Upstash Redis URL (rediss://...)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Set in Render Dashboard (e.g. https://your-app.vercel.app)
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ayusync-ai
          property: host

  # 2. AyuSync Python FastAPI Explainable AI Service
  - type: web
    name: ayusync-ai
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PYTHONUNBUFFERED
        value: "1"
